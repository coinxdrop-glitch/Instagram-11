<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoinXDrop - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0a0e14;--bg-card:#151d28;--bg-elevated:#1a2332;--fg:#e8edf3;--fg-muted:#6b7d94;--fg-dim:#3d4f63;--accent:#00d4aa;--accent-glow:rgba(0,212,170,0.25);--danger:#ff4757;--border:rgba(255,255,255,0.06);--glass:rgba(17,24,32,0.85);--radius:14px;--radius-sm:8px;--radius-full:9999px;--shadow:0 8px 32px rgba(0,0,0,0.4);--shadow-accent:0 4px 20px rgba(0,212,170,0.3);--transition:0.3s cubic-bezier(0.4,0,0.2,1)}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased}
.app-shell{max-width:430px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.bg-atmosphere{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-atmosphere .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.15;animation:orbFloat 12s ease-in-out infinite}
.bg-atmosphere .orb:nth-child(1){width:300px;height:300px;background:var(--accent);top:-80px;right:-60px}
.bg-atmosphere .orb:nth-child(2){width:200px;height:200px;background:#ff6b6b;bottom:100px;left:-40px;animation-delay:-4s;opacity:0.08}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.1)}66%{transform:translate(-15px,20px) scale(0.95)}}
.page{position:absolute;top:0;left:0;right:0;bottom:64px;overflow-y:auto;overflow-x:hidden;z-index:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}.page::-webkit-scrollbar{display:none}
.top-bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.top-bar h2{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
.profile-content{padding:20px 18px 30px}
.profile-header{text-align:center;padding:20px 0 24px}
.profile-avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin-bottom:14px;box-shadow:0 0 20px var(--accent-glow)}
.profile-name{font-size:22px;font-weight:700;margin-bottom:2px}
.profile-username{font-size:13px;color:var(--fg-muted);margin-bottom:10px}
.profile-bio{font-size:13px;color:var(--fg-muted);line-height:1.5;max-width:300px;margin:0 auto 14px}
.profile-link{font-size:12px;color:var(--accent);display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;word-break:break-all}
.profile-stats{display:flex;justify-content:center;gap:32px;margin-bottom:20px}
.profile-stat{text-align:center}.profile-stat .stat-num{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}.profile-stat .stat-lbl{font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.profile-actions{display:flex;gap:10px;margin-bottom:24px;justify-content:center}
.profile-action-btn{padding:10px 24px;border-radius:var(--radius-full);font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:8px;border:none}
.profile-action-btn.primary{background:var(--accent);color:#000}.profile-action-btn.primary:hover{box-shadow:var(--shadow-accent);transform:translateY(-1px)}
.profile-action-btn.secondary{background:var(--bg-card);color:var(--fg);border:1px solid var(--border)}.profile-action-btn.secondary:hover{border-color:rgba(255,255,255,0.12)}
.profile-action-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none}
.section-title{font-size:14px;font-weight:600;color:var(--fg-muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.post-grid-item{aspect-ratio:1;background:var(--bg-card);overflow:hidden;position:relative;cursor:pointer}
.post-grid-item img,.post-grid-item video{width:100%;height:100%;object-fit:cover;display:block}
.post-grid-item .type-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px}
.empty-posts{text-align:center;padding:40px 20px;color:var(--fg-dim);font-size:13px}
.menu-section{margin-bottom:20px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:var(--transition)}
.menu-item:hover{border-color:rgba(255,255,255,0.1)}
.menu-item i{font-size:16px;color:var(--fg-muted);width:20px;text-align:center}
.menu-item span{flex:1;font-size:14px;font-weight:500}
.menu-item .arrow{color:var(--fg-dim);font-size:12px}
.menu-item.danger span{color:var(--danger)}.menu-item.danger i{color:var(--danger)}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:64px;z-index:20;display:flex;align-items:center;justify-content:space-around;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--fg-dim);font-size:10px;font-family:'Outfit',sans-serif;font-weight:500;cursor:pointer;transition:var(--transition);padding:8px 12px;-webkit-tap-highlight-color:transparent}
.nav-item i{font-size:20px;transition:var(--transition)}.nav-item.active{color:var(--accent)}.nav-item.active i{filter:drop-shadow(0 0 6px var(--accent))}.nav-item:hover{color:var(--fg-muted)}
.auth-modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease;padding:20px}
.auth-modal.show{opacity:1;visibility:visible}
.auth-modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px)}
.auth-modal-card{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:28px 24px;max-width:360px;width:100%;transform:scale(0.9) translateY(20px);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.auth-modal.show .auth-modal-card{transform:scale(1) translateY(0)}
.auth-modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--fg-dim);font-size:18px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition)}
.auth-modal-close:hover{color:var(--fg);background:rgba(255,255,255,0.05)}
.auth-modal-icon{width:48px;height:48px;border-radius:50%;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:20px;color:var(--accent)}
.auth-modal-card h3{font-size:18px;font-weight:700;margin-bottom:4px;text-align:center}
.auth-modal-card .auth-sub{font-size:12px;color:var(--fg-muted);margin-bottom:16px;text-align:center}
.auth-modal-error{display:none;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--danger);text-align:center}
.auth-modal-error.show{display:block}
.modal-form-group{margin-bottom:12px}.modal-form-group label{display:block;font-size:11px;font-weight:600;color:var(--fg-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px}
.modal-form-input{width:100%;padding:11px 14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg);font-size:13px;font-family:'Outfit',sans-serif;outline:none;transition:var(--transition)}
.modal-form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}.modal-form-input::placeholder{color:var(--fg-dim)}
.modal-auth-btn{width:100%;padding:11px;background:var(--accent);color:#000;font-weight:700;font-size:13px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:'Outfit',sans-serif;transition:var(--transition);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.modal-auth-btn:hover{box-shadow:var(--shadow-accent)}.modal-auth-btn:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none}
.modal-auth-btn .modal-spinner{width:16px;height:16px;animation:spin-b .8s linear infinite;display:none}
.modal-auth-btn.loading .modal-spinner{display:block}.modal-auth-btn.loading .modal-btn-text{display:none}
@keyframes spin-b{100%{transform:rotate(360deg)}}
.modal-mode-toggle{text-align:center;font-size:12px;color:var(--fg-muted)}.modal-mode-toggle a{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
.modal-cancel{width:100%;padding:9px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg-muted);font-size:12px;font-family:'Outfit',sans-serif;cursor:pointer;transition:var(--transition);margin-top:4px}
.modal-cancel:hover{color:var(--fg);border-color:rgba(255,255,255,0.12)}
.toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;max-width:400px;width:calc(100% - 36px)}
.toast{padding:14px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;margin-bottom:8px;animation:toastIn .35s ease,toastOut .35s ease 2.5s forwards;box-shadow:var(--shadow)}
.toast.success{background:#0d2818;border:1px solid rgba(46,213,115,0.3);color:var(--success)}.toast.error{background:#2d0f13;border:1px solid rgba(255,71,87,0.3);color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
@media(min-width:431px){.app-shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app-shell" id="app">
  <div class="bg-atmosphere"><div class="orb"></div><div class="orb"></div></div>
  <div class="page"><div class="top-bar"><h2>Profile</h2></div>
    <div class="profile-content">
      <div class="profile-header">
        <img class="profile-avatar" id="profileAvatar" src="https://picsum.photos/seed/demo/200/200.jpg" alt="Avatar">
        <div class="profile-name" id="profileName">Demo User</div>
        <div class="profile-username" id="profileUsername">@demouser</div>
        <div class="profile-bio" id="profileBio">This is a demo profile. Sign in to create your own.</div>
        <div class="profile-link" id="profileLink" style="display:none"><i class="fas fa-link"></i> <span id="profileLinkText"></span></div>
        <div class="profile-stats"><div class="profile-stat"><div class="stat-num" id="postCount">0</div><div class="stat-lbl">Posts</div></div><div class="profile-stat"><div class="stat-num" id="likeCount">0</div><div class="stat-lbl">Likes</div></div><div class="profile-stat"><div class="stat-num" id="refCount">0</div><div class="stat-lbl">Referrals</div></div></div>
        <div class="profile-actions" id="profileActions">
          <button class="profile-action-btn primary" id="editProfileBtn" onclick="editProfile()" disabled style="display:none"><i class="fas fa-pen"></i> Edit</button>
          <button class="profile-action-btn secondary" id="shareBtn" onclick="shareProfile()" disabled style="display:none"><i class="fas fa-share"></i> Share</button>
          <button class="profile-action-btn primary" id="signInBtn" onclick="document.getElementById('authModal').classList.add('show')"><i class="fas fa-right-to-bracket"></i> Sign In</button>
        </div>
      </div>
      <div class="section-title">Posts</div>
      <div class="post-grid" id="postGrid"><div class="empty-posts" id="emptyPosts" style="grid-column:1/-1">No posts yet</div></div>
      <div style="height:20px"></div>
      <div class="section-title">Settings</div>
      <div class="menu-section">
        <div class="menu-item" onclick="goTo('wallet.html')"><i class="fas fa-wallet"></i><span>Wallet</span><i class="fas fa-chevron-right arrow"></i></div>
        <div class="menu-item" onclick="goTo('referral.html')"><i class="fas fa-gift"></i><span>Referral</span><i class="fas fa-chevron-right arrow"></i></div>
        <div class="menu-item danger" id="logoutBtn" style="display:none" onclick="logout()"><i class="fas fa-right-from-bracket"></i><span>Logout</span><i class="fas fa-chevron-right arrow"></i></div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item" onclick="goTo('home.html')"><i class="fas fa-house"></i><span>Home</span></button>
    <button class="nav-item" onclick="goTo('upload.html')"><i class="fas fa-cloud-arrow-up"></i><span>Upload</span></button>
    <button class="nav-item" onclick="goTo('wallet.html')"><i class="fas fa-wallet"></i><span>Wallet</span></button>
    <button class="nav-item" onclick="goTo('referral.html')"><i class="fas fa-gift"></i><span>Referral</span></button>
    <button class="nav-item active" onclick="goTo('profile.html')"><i class="fas fa-user"></i><span>Profile</span></button>
  </nav>
  <div class="auth-modal" id="authModal"><div class="auth-modal-overlay" onclick="hideAuthModal()"></div><div class="auth-modal-card"><button class="auth-modal-close" onclick="hideAuthModal()"><i class="fas fa-times"></i></button><div class="auth-modal-icon"><i class="fas fa-lock"></i></div><h3 id="modalTitle">Sign In</h3><p class="auth-sub" id="modalSub">Sign in to access profile</p><div class="auth-modal-error" id="modalError"></div><form onsubmit="return false"><div class="modal-form-group"><label>Email</label><input class="modal-form-input" id="modalEmail" type="email" placeholder="you@example.com"></div><div class="modal-form-group"><label>Password</label><input class="modal-form-input" id="modalPassword" type="password" placeholder="Min 6 characters" minlength="6"></div><div class="modal-form-group" id="modalConfirmGroup" style="display:none"><label>Confirm Password</label><input class="modal-form-input" id="modalConfirm" type="password" placeholder="Confirm password"></div><button class="modal-auth-btn" id="modalAuthBtn" type="submit" onclick="modalHandleAuth()"><span class="modal-btn-text" id="modalBtnText">Sign In</span><svg class="modal-spinner" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="rgba(0,0,0,0.2)" stroke-width="2"/><path d="M10 2a8 8 0 0 1 8 8" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></button></form><p class="modal-mode-toggle" id="modalModeToggle">Don't have an account? <a onclick="modalToggleMode()">Sign Up</a></p><button class="modal-cancel" onclick="hideAuthModal()">Cancel</button></div></div>
  <div class="toast-container" id="toastContainer"></div>
</div>
<script>
var firebaseConfig={apiKey:"AIzaSyAmQxNPKANzO8hEng5pdpAR3t7DJtwkG7U",authDomain:"aibmodel.firebaseapp.com",databaseURL:"https://aibmodel-default-rtdb.firebaseio.com",projectId:"aibmodel",storageBucket:"aibmodel.firebasestorage.app",messagingSenderId:"572663832515",appId:"1:572663832515:web:3fea2dac685b9b5f646776"};
firebase.initializeApp(firebaseConfig);var auth=firebase.auth(),db=firebase.database();var currentUid=localStorage.getItem('coinxdrop_uid'),modalIsSignUp=false;
function goTo(url){window.location.href=url}
function showToast(msg,type){var c=document.getElementById('toastContainer');var t=document.createElement('div');t.className='toast '+type;t.innerHTML='<i class="fas '+(type==='success'?'fa-check-circle':'fa-exclamation-circle')+'"></i>'+msg;c.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},3000)}
function hideAuthModal(){document.getElementById('authModal').classList.remove('show');document.getElementById('modalError').classList.remove('show');modalIsSignUp=false;document.getElementById('modalTitle').textContent='Sign In';document.getElementById('modalBtnText').textContent='Sign In';document.getElementById('modalConfirmGroup').style.display='none';document.getElementById('modalModeToggle').innerHTML='Don\'t have an account? <a onclick="modalToggleMode()">Sign Up</a>';document.getElementById('modalEmail').value='';document.getElementById('modalPassword').value='';document.getElementById('modalConfirm').value='';document.getElementById('modalAuthBtn').classList.remove('loading');document.getElementById('modalAuthBtn').disabled=false}
function modalToggleMode(){modalIsSignUp=!modalIsSignUp;document.getElementById('modalError').classList.remove('show');if(modalIsSignUp){document.getElementById('modalTitle').textContent='Create Account';document.getElementById('modalBtnText').textContent='Sign Up';document.getElementById('modalConfirmGroup').style.display='block';document.getElementById('modalModeToggle').innerHTML='Already have an account? <a onclick="modalToggleMode()">Sign In</a>'}else{document.getElementById('modalTitle').textContent='Sign In';document.getElementById('modalBtnText').textContent='Sign In';document.getElementById('modalConfirmGroup').style.display='none';document.getElementById('modalModeToggle').innerHTML='Don\'t have an account? <a onclick="modalToggleMode()">Sign Up</a>'}}
function modalFriendlyError(e){var m={"auth/email-already-in-use":"Email already registered.","auth/invalid-email":"Enter a valid email.","auth/weak-password":"Min 6 characters.","auth/user-not-found":"No account with this email.","auth/wrong-password":"Wrong password.","auth/too-many-requests":"Too many attempts.","auth/network-request-failed":"Network error.","auth/invalid-credential":"Invalid email or password."};return m[e.code]||"Failed: "+(e.message||"Error.")}
function saveUserToDB(user){var r=db.ref('users/'+user.uid);return r.once('value').then(function(s){if(s.exists()){return r.update({lastLoginAt:new Date().toISOString()})}else{var en=user.email?user.email.split('@')[0].replace(/[^a-zA-Z0-9]/g,''):'user';return r.set({uid:user.uid,displayName:en,email:user.email||null,photoURL:null,provider:'email',createdAt:user.metadata.creationTime||new Date().toISOString(),lastLoginAt:new Date().toISOString(),username:en,wallet:{balance:0,earnings:0},referralCode:user.uid.substring(0,8).toUpperCase()})}}).catch(function(e){console.error(e)})}
function modalHandleAuth(){var errEl=document.getElementById('modalError');errEl.classList.remove('show');var email=document.getElementById('modalEmail').value.trim();var password=document.getElementById('modalPassword').value;if(!email||!password){errEl.textContent='Fill in all fields';errEl.classList.add('show');return}if(modalIsSignUp){var confirm=document.getElementById('modalConfirm').value;if(password!==confirm){errEl.textContent='Passwords do not match';errEl.classList.add('show');return}}var btn=document.getElementById('modalAuthBtn');btn.disabled=true;btn.classList.add('loading');auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);var promise=modalIsSignUp?auth.createUserWithEmailAndPassword(email,password):auth.signInWithEmailAndPassword(email,password);promise.then(function(result){var user=result.user;currentUid=user.uid;localStorage.setItem('coinxdrop_uid',user.uid);return saveUserToDB(user).then(function(){hideAuthModal();showToast('Success!','success');loadProfile()})}).catch(function(e){btn.disabled=false;btn.classList.remove('loading');errEl.textContent=modalFriendlyError(e);errEl.classList.add('show')})}
function editProfile(){if(!currentUid){document.getElementById('authModal').classList.add('show');return}window.location.href='edit profile.html'}
function shareProfile(){if(!currentUid){document.getElementById('authModal').classList.add('show');return}if(navigator.share){navigator.share({title:'CoinXDrop Profile',url:window.location.href}).catch(function(){})}else{navigator.clipboard.writeText(window.location.href).then(function(){showToast('Link copied','success')})}}
function logout(){if(!currentUid)return;auth.signOut().then(function(){localStorage.removeItem('coinxdrop_uid');currentUid=null;showToast('Logged out','success');loadProfile()}).catch(function(){showToast('Logout failed','error')})}
function loadProfile(){var editBtn=document.getElementById('editProfileBtn'),shareBtn=document.getElementById('shareBtn'),signInBtn=document.getElementById('signInBtn'),logoutBtn=document.getElementById('logoutBtn');
if(currentUid){db.ref('users/'+currentUid).once('value',function(snap){var ud=snap.val()||{};document.getElementById('profileAvatar').src=ud.avatar||ud.photoURL||'https://picsum.photos/seed/'+currentUid+'/200/200.jpg';document.getElementById('profileName').textContent=ud.displayName||'User';document.getElementById('profileUsername').textContent='@'+(ud.username||'user');document.getElementById('profileBio').textContent=ud.bio||'No bio yet';if(ud.profileLink){document.getElementById('profileLink').style.display='inline-flex';document.getElementById('profileLinkText').textContent=ud.profileLink}else{document.getElementById('profileLink').style.display='none'}editBtn.style.display='flex';editBtn.disabled=false;shareBtn.style.display='flex';shareBtn.disabled=false;signInBtn.style.display='none';logoutBtn.style.display='flex'});
db.ref('posts').orderByChild('userId').equalTo(currentUid).once('value',function(snap){var count=0,totalLikes=0,grid=document.getElementById('postGrid'),empty=document.getElementById('emptyPosts');if(!snap.exists()){grid.innerHTML='';grid.appendChild(empty);empty.style.display='block';document.getElementById('postCount').textContent='0';document.getElementById('likeCount').textContent='0';return}empty.style.display='none';var html='';snap.forEach(function(child){count++;totalLikes+=(child.val().likeCount||0);var p=child.val();if(p.type==='video'){html+='<div class="post-grid-item"><img src="'+(p.thumbnailUrl||'https://picsum.photos/seed/'+child.key+'/300/300.jpg')+'" alt="" onerror="this.style.display=\'none\'"><span class="type-badge"><i class="fas fa-play"></i></span></div>'}else{html+='<div class="post-grid-item"><img src="'+p.mediaUrl+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"></div>'}});grid.innerHTML=html;document.getElementById('postCount').textContent=count;document.getElementById('likeCount').textContent=totalLikes});
db.ref('referrals/'+currentUid).once('value',function(snap){var c=0;if(snap.exists())snap.forEach(function(){c++});document.getElementById('refCount').textContent=c})}
