<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Sign In - CoinXDrop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#0a0a0f;--surface:#111118;--surface-2:#18181f;--border:rgba(255,255,255,0.07);--border-hover:rgba(124,111,255,0.35);--accent:#7c6fff;--accent-dim:rgba(124,111,255,0.15);--accent-glow:rgba(124,111,255,0.25);--text-primary:#f0eeff;--text-secondary:#8b8aa0;--text-muted:#4a4862;--success:#22c55e;--error:#f87171;--ease-spring:cubic-bezier(0.34,1.56,0.64,1);--ease-out:cubic-bezier(0.22,1,0.36,1);--radius-card:20px;--radius-btn:14px;--radius-sm:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100%;min-height:100dvh;background:var(--bg);color:var(--text-primary);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;align-items:center;justify-content:center}
.bg-orbs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.35;animation:orb-drift 18s ease-in-out infinite alternate}
.orb-1{width:420px;height:420px;background:radial-gradient(circle,#4f3de0 0%,transparent 70%);top:-120px;left:-80px;animation-duration:20s}
.orb-2{width:340px;height:340px;background:radial-gradient(circle,#7c6fff 0%,transparent 70%);bottom:-100px;right:-60px;animation-delay:-7s;animation-duration:16s}
.orb-3{width:260px;height:260px;background:radial-gradient(circle,#a78bfa 0%,transparent 70%);top:50%;left:55%;transform:translate(-50%,-50%);opacity:0.18;animation-delay:-13s;animation-duration:22s}
@keyframes orb-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,40px) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.overlay{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity .4s var(--ease-out),visibility .4s}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.spinner-ring{width:52px;height:52px}
.spinner-svg{width:100%;height:100%;animation:rotate 1.4s linear infinite}
.spinner-track{stroke:rgba(255,255,255,0.06);stroke-width:3}
.spinner-fill{stroke:var(--accent);stroke-width:3;stroke-dasharray:90 138;stroke-dashoffset:0;stroke-linecap:round;animation:dash 1.4s ease-in-out infinite}
@keyframes rotate{100%{transform:rotate(360deg)}}
@keyframes dash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-50}100%{stroke-dashoffset:-138}}
.overlay-text{color:var(--text-secondary);font-size:14px;font-weight:400;letter-spacing:0.02em}
.success-flash{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;visibility:hidden;transition:opacity .35s var(--ease-out),visibility .35s}
.success-flash.show{opacity:1;visibility:visible}
.success-icon{width:68px;height:68px;color:var(--success);transform:scale(0)}
.success-flash.show .success-icon{animation:pop-in .45s var(--ease-spring) .05s both}
@keyframes pop-in{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.checkmark{stroke-dasharray:33;stroke-dashoffset:33;animation:none}
.success-flash.show .checkmark{animation:draw-check .4s ease-out .35s forwards}
@keyframes draw-check{to{stroke-dashoffset:0}}
.success-flash p{color:var(--text-secondary);font-size:15px;font-weight:500}
.auth-container{position:relative;z-index:1;width:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;opacity:0;transform:translateY(12px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.auth-container.visible{opacity:1;transform:translateY(0)}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:36px 28px 32px;display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 20px 60px rgba(0,0,0,0.5),0 0 80px rgba(124,111,255,0.06);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;inset:0;border-radius:var(--radius-card);background:linear-gradient(135deg,rgba(124,111,255,0.06) 0%,transparent 50%);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.brand-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px}
.brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--text-primary);letter-spacing:-0.01em}
.heading{margin-bottom:24px}
.heading-primary{font-family:'Syne',sans-serif;font-size:clamp(22px,5vw,26px);font-weight:700;color:var(--text-primary);letter-spacing:-0.03em;line-height:1.2;margin-bottom:6px}
.heading-sub{font-size:14px;font-weight:400;color:var(--text-secondary);line-height:1.5}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.form-input{width:100%;padding:13px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.form-input::placeholder{color:var(--text-muted)}
.auth-btn{width:100%;padding:13px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;border:none;border-radius:var(--radius-btn);cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s ease;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.auth-btn:hover{box-shadow:0 0 0 3px var(--accent-dim),0 4px 20px rgba(0,0,0,0.3);transform:translateY(-1px)}
.auth-btn:active{transform:translateY(0) scale(0.98)}
.auth-btn:disabled{cursor:not-allowed;opacity:0.6;transform:none;box-shadow:none}
.auth-btn .btn-spinner{width:18px;height:18px;animation:spin-btn .9s linear infinite;display:none}
.auth-btn.loading .btn-spinner{display:block}
.auth-btn.loading .btn-label{display:none}
@keyframes spin-btn{100%{transform:rotate(360deg)}}
.mode-toggle{text-align:center;margin-top:20px;font-size:13px;color:var(--text-secondary)}
.mode-toggle a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer;transition:color .15s}
.mode-toggle a:hover{color:#a78bfa}
.error-box{display:none;align-items:flex-start;gap:10px;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;animation:slide-in .25s var(--ease-out)}
.error-box.show{display:flex}
@keyframes slide-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.error-icon{width:18px;height:18px;flex-shrink:0;color:var(--error);margin-top:1px}
#errorText{font-size:13px;color:var(--error);line-height:1.5}
.footer-note{margin-top:24px;font-size:12px;color:var(--text-muted);text-align:center;line-height:1.6}
.footer-link{color:var(--text-secondary);text-decoration:none;transition:color .15s}
.footer-link:hover{color:var(--accent)}
@media(min-width:480px){.auth-card{padding:44px 40px 40px}}
@media(max-width:360px){.auth-card{padding:28px 20px 24px}.heading-primary{font-size:21px}}
@supports(padding:env(safe-area-inset-bottom)){.auth-container{padding-bottom:calc(24px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<div class="overlay" id="overlay" role="status" aria-live="polite">
  <div class="spinner-ring"><svg viewBox="0 0 52 52" class="spinner-svg" aria-hidden="true"><circle class="spinner-track" cx="26" cy="26" r="22" fill="none"/><circle class="spinner-fill" cx="26" cy="26" r="22" fill="none"/></svg></div>
  <p class="overlay-text" id="overlayText">Checking session…</p>
</div>
<div class="success-flash" id="successFlash" aria-hidden="true">
  <div class="success-icon"><svg viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="25" stroke="currentColor" stroke-width="2"/><path class="checkmark" d="M14 26.5l8 8 16-16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <p>Success!</p>
</div>
<main class="auth-container" id="authContainer" aria-label="Authentication">
  <div class="auth-card" role="main">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="12" height="12" rx="3" fill="url(#g1)"/><rect x="16" width="12" height="12" rx="3" fill="url(#g2)" opacity=".7"/><rect x="8" y="16" width="12" height="12" rx="3" fill="url(#g3)" opacity=".85"/><defs><linearGradient id="g1" x1="0" y1="0" x2="12" y2="12" gradientUnits="userSpaceOnUse"><stop stop-color="#7c6fff"/><stop offset="1" stop-color="#5a4de6"/></linearGradient><linearGradient id="g2" x1="16" y1="0" x2="28" y2="12" gradientUnits="userSpaceOnUse"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c6fff"/></linearGradient><linearGradient id="g3" x1="8" y1="16" x2="20" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs></svg></div>
      <span class="brand-name">CoinXDrop</span>
    </div>
    <div class="heading">
      <h1 class="heading-primary" id="headingTitle">Welcome back</h1>
      <p class="heading-sub" id="headingSub">Sign in to continue to CoinXDrop</p>
    </div>
    <div class="error-box" id="errorBox" role="alert"><svg class="error-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4m0 3.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="errorText"></span></div>
    <form id="authForm" onsubmit="return false">
      <div class="form-group"><label for="emailInput">Email</label><input class="form-input" id="emailInput" type="email" placeholder="you@example.com" required autocomplete="email"></div>
      <div class="form-group"><label for="passwordInput">Password</label><input class="form-input" id="passwordInput" type="password" placeholder="Enter your password" required autocomplete="current-password" minlength="6"></div>
      <div class="form-group" id="confirmGroup" style="display:none"><label for="confirmInput">Confirm Password</label><input class="form-input" id="confirmInput" type="password" placeholder="Confirm your password" autocomplete="new-password" minlength="6"></div>
      <button class="auth-btn" id="authBtn" type="submit" onclick="handleAuth()"><span class="btn-label" id="authBtnLabel">Sign In</span><svg class="btn-spinner" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="rgba(255,255,255,0.25)" stroke-width="2"/><path d="M10 2a8 8 0 0 1 8 8" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></button>
    </form>
    <p class="mode-toggle" id="modeToggle">Don't have an account? <a onclick="toggleMode()">Sign Up</a></p>
    <p class="footer-note">By continuing you agree to our <a href="#" class="footer-link">Terms</a> and <a href="#" class="footer-link">Privacy Policy</a>.</p>
  </div>
</main>
<script>
"use strict";
var firebaseConfig={apiKey:"AIzaSyAmQxNPKANzO8hEng5pdpAR3t7DJtwkG7U",authDomain:"aibmodel.firebaseapp.com",databaseURL:"https://aibmodel-default-rtdb.firebaseio.com",projectId:"aibmodel",storageBucket:"aibmodel.firebasestorage.app",messagingSenderId:"572663832515",appId:"1:572663832515:web:3fea2dac685b9b5f646776"};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(),db=firebase.database();
var overlay=document.getElementById("overlay"),overlayText=document.getElementById("overlayText"),authContainer=document.getElementById("authContainer");
var authBtn=document.getElementById("authBtn"),authBtnLabel=document.getElementById("authBtnLabel"),errorBox=document.getElementById("errorBox"),errorText=document.getElementById("errorText");
var successFlash=document.getElementById("successFlash");
var isSignUp=false;

function showOverlay(m){overlayText.textContent=m||"Please wait…";overlay.classList.remove("hidden")}
function hideOverlay(){overlay.classList.add("hidden");authContainer.classList.add("visible")}
function setButtonLoading(l){authBtn.disabled=l;authBtn.classList.toggle("loading",l)}
function showError(m){errorText.textContent=m;errorBox.classList.add("show")}
function clearError(){errorBox.classList.remove("show");errorText.textContent=""}
function friendlyError(e){var m={"auth/email-already-in-use":"This email is already registered. Sign in instead.","auth/invalid-email":"Please enter a valid email address.","auth/weak-password":"Password must be at least 6 characters.","auth/user-not-found":"No account found with this email.","auth/wrong-password":"Incorrect password. Please try again.","auth/too-many-requests":"Too many attempts. Please wait a moment.","auth/network-request-failed":"Network error. Check your connection.","auth/invalid-credential":"Invalid email or password. Please try again."};return m[e.code]||"Authentication failed: "+(e.message||"Unknown error.")}

function toggleMode(){
  isSignUp=!isSignUp;
  clearError();
  if(isSignUp){
    document.getElementById("headingTitle").textContent="Create Account";
    document.getElementById("headingSub").textContent="Sign up to join CoinXDrop";
    document.getElementById("authBtnLabel").textContent="Sign Up";
    document.getElementById("confirmGroup").style.display="block";
    document.getElementById("passwordInput").setAttribute("autocomplete","new-password");
    document.getElementById("modeToggle").innerHTML='Already have an account? <a onclick="toggleMode()">Sign In</a>';
  }else{
    document.getElementById("headingTitle").textContent="Welcome back";
    document.getElementById("headingSub").textContent="Sign in to continue to CoinXDrop";
    document.getElementById("authBtnLabel").textContent="Sign In";
    document.getElementById("confirmGroup").style.display="none";
    document.getElementById("passwordInput").setAttribute("autocomplete","current-password");
    document.getElementById("modeToggle").innerHTML='Don\'t have an account? <a onclick="toggleMode()">Sign Up</a>';
  }
}

function saveUserToDatabase(user){
  var r=db.ref("users/"+user.uid);
  return r.once("value").then(function(s){
    if(s.exists()){return r.update({lastLoginAt:new Date().toISOString()})}
    else{var emailName=user.email?user.email.split("@")[0].replace(/[^a-zA-Z0-9]/g,""):"user";return r.set({uid:user.uid,displayName:emailName,email:user.email||null,photoURL:null,provider:"email",createdAt:user.metadata.creationTime||new Date().toISOString(),lastLoginAt:new Date().toISOString(),username:emailName,wallet:{balance:0,earnings:0},referralCode:user.uid.substring(0,8).toUpperCase()})}
  }).catch(function(e){console.error("[Auth] DB write failed:",e)});
}

async function handleSuccessfulAuth(user){
  successFlash.classList.add("show");
  await saveUserToDatabase(user);
  await new Promise(function(r){setTimeout(r,1100)});
  var c=auth.currentUser;
  if(c&&c.uid===user.uid){localStorage.setItem("coinxdrop_uid",user.uid);window.location.replace("home.html")}
  else{successFlash.classList.remove("show");setButtonLoading(false);showError("Session could not be confirmed.")}
}

function handleAuth(){
  clearError();
  if(authBtn.disabled)return;
  var email=document.getElementById("emailInput").value.trim();
  var password=document.getElementById("passwordInput").value;
  if(!email||!password){showError("Please fill in all fields");return}
  if(isSignUp){
    var confirm=document.getElementById("confirmInput").value;
    if(password!==confirm){showError("Passwords do not match");return}
    if(password.length<6){showError("Password must be at least 6 characters");return}
  }
  setButtonLoading(true);
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  var promise;
  if(isSignUp){promise=auth.createUserWithEmailAndPassword(email,password)}
  else{promise=auth.signInWithEmailAndPassword(email,password)}
  promise.then(function(result){handleSuccessfulAuth(result.user)}).catch(function(e){console.error("[Auth] Error:",e);setButtonLoading(false);showError(friendlyError(e))});
}

document.getElementById("authForm").addEventListener("submit",function(e){e.preventDefault();handleAuth()});
(async function init(){
  showOverlay("Checking session…");
  auth.onAuthStateChanged(async function(user){
    if(user){overlayText.textContent="Redirecting…";await saveUserToDatabase(user);localStorage.setItem("coinxdrop_uid",user.uid);window.location.replace("home.html")}
    else{hideOverlay()}
  });
})();
</script>
</body>
</html>
